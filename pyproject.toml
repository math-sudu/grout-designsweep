[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grout-designsweep"
version = "0.1.0"
description = "Physics-informed grout selection under staged loading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pymupdf",
  "pyyaml",
  "scipy",
  "torch",
  "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest"]
paper = ["python-docx"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
