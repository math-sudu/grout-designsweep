# Process geometry and activation sequence: Liu et al. (2021), sections 2.1, 3.2.
# Pressure is prescribed over two rings behind the tail; solid support then
# replaces that pressure boundary. Timing and displacement allowance below are
# design coordinates for the public-paste calculation.
process:
  ring_width_m: 1.8
  pressure_supported_rings: 2
  source_doi: 10.1016/j.tust.2021.103857
  source_section: '3.2'

task:
  remaining_limit_um_kpa: 2.2
  latest_handover_h: 4.0
  planned_handover_h: [2.0, 3.0, 4.0]
  reference_mix: W32
  scenario: nominal

# Complete prescribed computational tasks; fractions refer to the final
# circumferential mean pressure. The pressure ratio is an external input.
complete_plans:
  lower_displacement_um_kpa: -2.2
  upper_displacement_um_kpa: 2.2
  source: prescribed numerical tasks using the original displacement scale
  handover_pressure_ratios: [1.0, 0.8, 0.5, 0.2]
  envelope_source: results/pinn_support/design/continuous
  staged:
    - id: early_requirement
      times_h: [0.37, 1.73, 4.0]
      minimum_cumulative_fractions: [0.2, 0.5, 1.0]
      pressure_ratio: 1.0
    - id: later_requirement
      times_h: [1.73, 3.1, 4.0]
      minimum_cumulative_fractions: [0.2, 0.5, 1.0]
      pressure_ratio: 1.0
    - id: asymmetric_requirement
      times_h: [0.37, 1.73, 4.0]
      minimum_cumulative_fractions: [0.2, 0.5, 1.0]
      pressure_ratio: 0.5
  continuation:
    checkpoint: results/pinn_support/W40/history_pressure/loaded_checkpoint.npz
    times_h: [1.73, 3.1, 4.0]
    minimum_cumulative_fractions: [0.3, 0.5, 1.0]
    pressure_ratios: [1.0, 0.5]
